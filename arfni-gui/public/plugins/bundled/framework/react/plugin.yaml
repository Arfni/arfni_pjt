apiVersion: v0.1
name: react
displayName: React
version: 1.0.0
category: framework
description: "JavaScript library for building user interfaces"
author: ARFNI Team
license: MIT
icon: icon.png

provides:
  service_kinds:
    - app.react

inputs:
  node_version:
    description: "Node.js version"
    type: text
    required: false
    default: "18-alpine"

  port:
    description: "Application port"
    type: number
    required: false
    env_var: PORT
    default: 3000

  api_url:
    description: "Backend API URL"
    type: text
    required: false
    env_var: REACT_APP_API_URL
    default: ""

contributes:
  services:
    react:
      kind: app.react
      type: docker.container
      spec:
        build:
          context: "."
          dockerfile: "Dockerfile"
        ports:
          - "{{port}}:{{port}}"
        environment:
          PORT: "{{port}}"
          REACT_APP_API_URL: "{{api_url}}"
          NODE_ENV: "production"

  canvas:
    nodeType: react
    label: React
    description: "Frontend library"
    category: runtime
    ports:
      - name: http
        port: 3000
        protocol: tcp
    connections:
      inputs:
        - type: api
          name: backend
          protocol: http
          env_var: REACT_APP_API_URL
apiVersion: v0.1
name: react
displayName: React
version: 1.1.0
category: framework
description: "JavaScript library for building user interfaces"
author: ARFNI Team
license: MIT
icon: icon.png

detection:
  enabled: true
  priority: 10
  required_files:
    - package.json
  file_content_patterns:
    package.json:
      contains: ["\"react\""]

provides:
  service_kinds:
    - app.react

inputs:
  node_version:
    description: "Node.js version"
    type: select
    scope: build  # Only needed at build time for Dockerfile
    options:
      - "16-alpine"
      - "18-alpine"
      - "20-alpine"
    required: false
    default: "18-alpine"

  port:
    description: "Application port"
    type: number
    scope: both  # Needed for both Dockerfile EXPOSE and runtime PORT env
    required: false
    env_var: PORT
    default: 3000

  environment:
    description: "Deployment environment"
    type: select
    scope: runtime  # Only needed at runtime
    options:
      - development
      - staging
      - production
    default: development
    env_var: NODE_ENV
    required: false

  build_command:
    description: "Build command"
    type: text
    scope: build  # Only for Dockerfile RUN command
    default: "npm run build"
    required: false

  start_command:
    description: "Start command"
    type: text
    scope: build  # Only for Dockerfile CMD
    default: ""
    placeholder: "Defaults to serve -s build -l {port}"
    required: false

contributes:
  services:
    react:
      kind: app.react
      type: docker.container
      spec:
        build:
          context: "."
          dockerfile: "Dockerfile"
        ports:
          - "{{port}}:{{port}}"
        # No hardcoded environment variables
        environment: {}

  canvas:
    nodeType: react
    label: React
    description: "Frontend library"
    category: runtime
    ports:
      - name: http
        port: 3000
        protocol: tcp
    connections:
      inputs:
        - type: api
          name: backend
          protocol: http
          description: "Backend API connection"
          optional: true
apiVersion: v0.1
name: nextjs
displayName: Next.js
version: 1.0.0
category: framework
description: "React framework for production"
author: ARFNI Team
license: MIT
icon: icon.png

detection:
  enabled: true
  priority: 10
  required_files:
    - package.json
  file_content_patterns:
    package.json:
      contains: ["\"next\""]

provides:
  service_kinds:
    - app.nextjs

inputs:
  node_version:
    description: "Node.js version"
    type: text
    required: false
    default: "18-alpine"

  port:
    description: "Application port"
    type: number
    required: false
    env_var: PORT
    default: 3000

  api_url:
    description: "Backend API URL"
    type: text
    required: false
    env_var: NEXT_PUBLIC_API_URL
    default: ""

contributes:
  services:
    nextjs:
      kind: app.nextjs
      type: docker.container
      spec:
        build:
          context: "."
          dockerfile: "Dockerfile"
        ports:
          - "{{port}}:{{port}}"
        environment:
          PORT: "{{port}}"
          NEXT_PUBLIC_API_URL: "{{api_url}}"
          NODE_ENV: "production"

  canvas:
    nodeType: nextjs
    label: Next.js
    description: "React framework"
    category: runtime
    ports:
      - name: http
        port: 3000
        protocol: tcp
    connections:
      inputs:
        - type: api
          name: backend
          protocol: http
          env_var: NEXT_PUBLIC_API_URL
apiVersion: v0.1
name: flask
displayName: Flask
version: 1.0.0
category: framework
description: "Lightweight Python web framework"
author: ARFNI Team
license: MIT

provides:
  service_kinds:
    - app.flask

contributes:
  services:
    flask:
      kind: app.flask
      type: docker.container
      spec:
        build:
          context: "."
          dockerfile: "Dockerfile"
        ports:
          - "5000:5000"

  canvas:
    nodeType: flask
    label: Flask
    description: "Flask web framework"
    category: runtime
    ports:
      - name: http
        port: 5000
        protocol: tcp
    connections:
      inputs:
        - type: database
          name: database
          protocol: any
          env_var: DATABASE_URL
      outputs:
        - type: api
          name: api
          protocol: http

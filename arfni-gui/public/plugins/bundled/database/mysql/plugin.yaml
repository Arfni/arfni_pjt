apiVersion: v0.1
name: mysql
displayName: MySQL
version: 1.0.0
category: database
description: "Popular open-source relational database"
author: ARFNI Team
license: MIT
icon: icon.png

provides:
  service_kinds:
    - db.mysql

inputs:
  mysql_root_password:
    description: "MySQL root password"
    type: password
    required: true
    env_var: MYSQL_ROOT_PASSWORD
    default: "mysql123"

  mysql_database:
    description: "Default database name"
    type: text
    required: false
    env_var: MYSQL_DATABASE
    default: "myapp"

  mysql_user:
    description: "Database user"
    type: text
    required: false
    env_var: MYSQL_USER
    default: "myuser"

  mysql_password:
    description: "Database user password"
    type: password
    required: false
    env_var: MYSQL_PASSWORD
    default: "mypassword"

contributes:
  services:
    mysql:
      kind: db.mysql
      type: docker.container
      spec:
        image: "mysql:8.0"
        ports:
          - "3306:3306"
        environment:
          MYSQL_ROOT_PASSWORD: "rootpassword"
          MYSQL_DATABASE: "myapp"
          MYSQL_USER: "myuser"
          MYSQL_PASSWORD: "mypassword"
        volumes:
          - "mysql_data:/var/lib/mysql"
        healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
          interval: 10s
          timeout: 5s
          retries: 5

  canvas:
    nodeType: mysql
    label: MySQL
    description: "Open-source DB"
    category: database
    ports:
      - name: mysql
        port: 3306
        protocol: tcp
    connections:
      outputs:
        - type: database
          name: mysql
          protocol: mysql
          env_prefix: DATABASE
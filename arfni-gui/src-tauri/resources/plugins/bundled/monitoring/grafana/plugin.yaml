apiVersion: v0.1
name: grafana
displayName: Grafana
version: 1.0.0
category: monitoring
description: "Analytics and interactive visualization platform"
author: ARFNI Team
license: MIT

provides:
  service_kinds:
    - monitoring.grafana

contributes:
  services:
    grafana:
      kind: docker.container
      spec:
        image: "grafana/grafana:latest"
        ports:
          - "3200:3200"
        volumes:
          - host: "./grafana/provisioning"
            mount: "/etc/grafana/provisioning"
          - host: "grafana-data"
            mount: "/var/lib/grafana"
        env:
          GF_SERVER_HTTP_PORT: "3200"
          GF_AUTH_ANONYMOUS_ENABLED: "true"
          GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
          GF_SECURITY_ADMIN_PASSWORD: "admin"
          GF_AUTH_DISABLE_LOGIN_FORM: "true"
          GF_SECURITY_ALLOW_EMBEDDING: "true"
          GF_SECURITY_COOKIE_SAMESITE: "none"
          GF_SECURITY_COOKIE_SECURE: "false"

  canvas:
    nodeType: grafana
    label: Grafana
    description: "Visualization platform"
    category: infra
    ports:
      - name: http
        port: 3001
        protocol: tcp

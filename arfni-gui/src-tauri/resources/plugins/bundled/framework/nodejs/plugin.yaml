apiVersion: v0.1
name: nodejs
displayName: Node.js
version: 1.0.0
category: framework
description: "JavaScript runtime built on Chrome's V8 engine"
author: ARFNI Team
license: MIT
icon: icon.png

detection:
  enabled: true
  priority: 5
  required_files:
    - package.json

provides:
  service_kinds:
    - app.nodejs

inputs:
  node_version:
    description: "Node.js version"
    type: text
    scope: build
    required: false
    default: "18-alpine"

contributes:
  services:
    nodejs:
      kind: app.nodejs
      type: docker.container
      spec:
        build:
          context: "."
          dockerfile: "Dockerfile"
        ports:
          - "{{port}}:{{port}}"
        environment: {}  # Environment variables will be auto-generated based on scope

  canvas:
    nodeType: nodejs
    label: Node.js
    description: "JavaScript runtime"
    category: runtime
    ports:
      - name: http
        port: 3000
        protocol: tcp
    connections:
      inputs:
        - type: database
          name: database
          protocol: any
          env_var: DATABASE_URL
      outputs:
        - type: api
          name: api
          protocol: http
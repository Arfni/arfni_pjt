apiVersion: v0.1
name: fastapi
displayName: FastAPI
version: 1.0.0
category: framework
description: "Modern Python web framework for building APIs"
author: ARFNI Team
license: MIT
icon: icon.png

detection:
  enabled: true
  priority: 14
  required_files:
    - requirements.txt
  file_content_patterns:
    requirements.txt:
      contains: ["fastapi", "FastAPI"]

provides:
  service_kinds:
    - app.fastapi

inputs:
  python_version:
    description: "Python version"
    type: select
    required: false
    options:
      - "3.11"
      - "3.12"
    default: "3.12"
    scope: build

contributes:
  services:
    fastapi:
      kind: app.fastapi
      type: docker.container
      spec:
        build:
          context: "."
          dockerfile: "Dockerfile"
        ports:
          - "8000:8000"

  canvas:
    nodeType: fastapi
    label: FastAPI
    description: "Modern Python API framework"
    category: runtime
    ports:
      - name: http
        port: 8000
        protocol: tcp
    connections:
      inputs:
        - type: database
          name: database
          protocol: any
          env_var: DATABASE_URL
      outputs:
        - type: api
          name: api
          protocol: http

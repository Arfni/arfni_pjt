apiVersion: v0.1
name: fastapi
displayName: FastAPI
version: 1.0.0
category: framework
description: "Modern Python web framework for building APIs"
author: ARFNI Team
license: MIT
icon: icon.png

detection:
  enabled: true
  priority: 14
  required_files:
    - requirements.txt
  file_content_patterns:
    requirements.txt:
      contains: ["fastapi", "FastAPI"]

provides:
  service_kinds:
    - app.fastapi

inputs:
  python_version:
    description: "Python version"
    type: select
    required: false
    options:
      - "3.11"
      - "3.12"
    default: "3.12"
    scope: build

  port:
    description: "Application port"
    type: number
    required: false
    env_var: PORT
    default: 8000
    scope: both

  app_module:
    description: "FastAPI app module"
    type: text
    required: false
    default: "main:app"
    scope: both

  workers:
    description: "Number of Gunicorn workers"
    type: number
    required: false
    env_var: WORKERS
    default: 4
    scope: runtime

  requirements_file:
    description: "Requirements file path"
    type: text
    required: false
    default: "requirements.txt"
    scope: build

  reload:
    description: "Enable auto-reload (development only)"
    type: select
    required: false
    options:
      - "false"
      - "true"
    default: "false"
    scope: runtime

  database_url:
    description: "Database connection URL"
    type: text
    required: false
    env_var: DATABASE_URL
    default: ""
    scope: runtime

  log_level:
    description: "Logging level"
    type: select
    required: false
    options:
      - "debug"
      - "info"
      - "warning"
      - "error"
    default: "info"
    scope: runtime
    env_var: LOG_LEVEL

contributes:
  services:
    fastapi:
      kind: app.fastapi
      type: docker.container
      spec:
        build:
          context: "."
          dockerfile: "Dockerfile"
        ports:
          - "8000:8000"

  canvas:
    nodeType: fastapi
    label: FastAPI
    description: "Modern Python API framework"
    category: runtime
    ports:
      - name: http
        port: 8000
        protocol: tcp
    connections:
      inputs:
        - type: database
          name: database
          protocol: any
          env_var: DATABASE_URL
      outputs:
        - type: api
          name: api
          protocol: http

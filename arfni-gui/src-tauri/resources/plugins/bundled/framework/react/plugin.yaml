apiVersion: v0.1
name: react
displayName: React
version: 1.1.0
category: framework
description: "JavaScript library for building user interfaces"
author: ARFNI Team
license: MIT
icon: icon.png

detection:
  enabled: true
  priority: 10
  required_files:
    - package.json
  file_content_patterns:
    package.json:
      contains: ["\"react\""]

provides:
  service_kinds:
    - app.react

inputs:
  node_version:
    description: "Node.js version"
    type: select
    scope: build
    options:
      - "16-alpine"
      - "18-alpine"
      - "20-alpine"
    required: false
    default: "18-alpine"

contributes:
  services:
    react:
      kind: app.react
      type: docker.container
      spec:
        build:
          context: "."
          dockerfile: "Dockerfile"
        ports:
          - "{{port}}:{{port}}"
        # No hardcoded environment variables
        environment: {}

  canvas:
    nodeType: react
    label: React
    description: "Frontend library"
    category: runtime
    ports:
      - name: http
        port: 3000
        protocol: tcp
    connections:
      inputs:
        - type: api
          name: backend
          protocol: http
          description: "Backend API connection"
          optional: true
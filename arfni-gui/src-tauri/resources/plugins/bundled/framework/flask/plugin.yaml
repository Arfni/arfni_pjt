apiVersion: v0.1
name: flask
displayName: Flask
version: 1.0.0
category: framework
description: "Lightweight Python web framework"
author: ARFNI Team
license: MIT
icon: icon.png

detection:
  enabled: true
  priority: 13
  required_files:
    - requirements.txt
  file_content_patterns:
    requirements.txt:
      contains: ["flask", "Flask"]

provides:
  service_kinds:
    - app.flask

inputs:
  python_version:
    description: "Python version"
    type: select
    required: false
    options:
      - "3.11"
      - "3.12"
    default: "3.11"
    scope: build

  port:
    description: "Application port"
    type: number
    required: false
    env_var: PORT
    default: 5000
    scope: both

  app_module:
    description: "Flask app module"
    type: text
    required: false
    default: "app:app"
    scope: both

  workers:
    description: "Number of Gunicorn workers"
    type: number
    required: false
    env_var: WORKERS
    default: 4
    scope: runtime

  requirements_file:
    description: "Requirements file path"
    type: text
    required: false
    default: "requirements.txt"
    scope: build

  flask_env:
    description: "Flask environment"
    type: select
    required: false
    options:
      - "production"
      - "development"
    default: "production"
    scope: runtime
    env_var: FLASK_ENV

  database_url:
    description: "Database connection URL"
    type: text
    required: false
    env_var: DATABASE_URL
    default: ""
    scope: runtime

contributes:
  services:
    flask:
      kind: app.flask
      type: docker.container
      spec:
        build:
          context: "."
          dockerfile: "Dockerfile"
        ports:
          - "5000:5000"

  canvas:
    nodeType: flask
    label: Flask
    description: "Python micro web framework"
    category: runtime
    ports:
      - name: http
        port: 5000
        protocol: tcp
    connections:
      inputs:
        - type: database
          name: database
          protocol: any
          env_var: DATABASE_URL
      outputs:
        - type: api
          name: api
          protocol: http

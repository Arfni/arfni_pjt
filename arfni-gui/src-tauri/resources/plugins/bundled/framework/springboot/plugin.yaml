apiVersion: v0.1
name: springboot
displayName: Spring Boot
version: 1.0.0
category: framework
description: "Java framework for building enterprise applications"
author: ARFNI Team
license: MIT
icon: icon.png

detection:
  enabled: true
  priority: 10
  required_files_any_of:
    - build.gradle
    - build.gradle.kts
    - pom.xml

provides:
  service_kinds:
    - app.spring

inputs:
  java_version:
    description: "Java version"
    type: select
    required: false
    options:
      - "11"
      - "17"
      - "21"
    default: "17"
    scope: build

contributes:
  services:
    spring:
      kind: app.spring
      type: docker.container
      spec:
        build:
          context: "."
          dockerfile: "Dockerfile"
        ports:
          - "8080:8080"

  canvas:
    nodeType: spring
    label: Spring Boot
    description: "Java framework"
    category: runtime
    ports:
      - name: http
        port: 8080
        protocol: tcp
    connections:
      inputs:
        - type: database
          name: database
          protocol: any
          env_var: DATABASE_URL
      outputs:
        - type: api
          name: api
          protocol: http

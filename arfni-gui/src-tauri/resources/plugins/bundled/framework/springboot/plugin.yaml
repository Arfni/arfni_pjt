apiVersion: v0.1
name: springboot
displayName: Spring Boot
version: 1.0.0
category: framework
description: "Java framework for building enterprise applications"
author: ARFNI Team
license: MIT
icon: icon.png

detection:
  enabled: true
  priority: 10
  required_files_any_of:
    - build.gradle
    - build.gradle.kts
    - pom.xml

provides:
  service_kinds:
    - app.spring

inputs:
  build_tool:
    description: "Build tool (auto-detected if not specified)"
    type: select
    required: false
    options:
      - "auto"
      - "maven"
      - "gradle"
    default: "auto"
    scope: build

  java_version:
    description: "Java version"
    type: select
    required: false
    options:
      - "11"
      - "17"
      - "21"
    default: "17"
    scope: build

  maven_version:
    description: "Maven version (for Maven builds)"
    type: select
    required: false
    options:
      - "3.8.8"
      - "3.9.9"
    default: "3.9.9"
    scope: build

  gradle_version:
    description: "Gradle version (for Gradle builds)"
    type: select
    required: false
    options:
      - "8.2"
      - "8.5"
      - "8.7"
    default: "8.5"
    scope: build

  port:
    description: "Application port"
    type: number
    required: false
    env_var: SERVER_PORT
    default: 8080
    scope: runtime

  database_url:
    description: "Database connection URL"
    type: text
    required: false
    env_var: DATABASE_URL
    default: ""
    scope: runtime

  profile:
    description: "Spring profile"
    type: text
    required: false
    env_var: SPRING_PROFILES_ACTIVE
    default: "production"
    scope: runtime

  jvm_opts:
    description: "Additional JVM options"
    type: text
    required: false
    env_var: JAVA_OPTS
    default: "-Xmx512m -Xms256m"
    scope: runtime

contributes:
  services:
    spring:
      kind: app.spring
      type: docker.container
      spec:
        build:
          context: "."
          dockerfile: "Dockerfile"
        ports:
          - "8080:8080"

  canvas:
    nodeType: spring
    label: Spring Boot
    description: "Java framework"
    category: runtime
    ports:
      - name: http
        port: 8080
        protocol: tcp
    connections:
      inputs:
        - type: database
          name: database
          protocol: any
          env_var: DATABASE_URL
      outputs:
        - type: api
          name: api
          protocol: http

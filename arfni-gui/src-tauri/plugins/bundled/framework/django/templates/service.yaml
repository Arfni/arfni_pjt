# Django service template for stack.yaml
build: ./apps/{{name}}
ports:
  - "{{port}}:8000"
environment:
  DATABASE_URL: "{{database_url}}"
  REDIS_URL: "{{redis_url}}"
  SECRET_KEY: "{{secret_key}}"
  DEBUG: "{{debug}}"
  ALLOWED_HOSTS: "{{allowed_hosts}}"
volumes:
  - host: ./apps/{{name}}/static
    mount: /app/static
  - host: ./apps/{{name}}/media
    mount: /app/media
health:
  http:
    path: /health/
    port: 8000
depends:
  {{#if database}}
  - {{database}}
  {{/if}}
  {{#if cache}}
  - {{cache}}
  {{/if}}
apiVersion: v0.1
name: springboot
displayName: Spring Boot
version: 1.0.0
category: framework
description: "Java framework for building enterprise applications"
author: ARFNI Team
license: MIT
icon: icon.png

provides:
  service_kinds:
    - app.springboot

inputs:
  java_version:
    description: "Java version"
    type: text
    required: false
    default: "17"

  port:
    description: "Application port"
    type: number
    required: false
    env_var: SERVER_PORT
    default: 8080

  database_url:
    description: "Database connection URL"
    type: text
    required: false
    env_var: DATABASE_URL
    default: ""

  profile:
    description: "Spring profile"
    type: text
    required: false
    env_var: SPRING_PROFILES_ACTIVE
    default: "production"

contributes:
  services:
    springboot:
      kind: app.springboot
      type: docker.container
      spec:
        build:
          context: "."
          dockerfile: "Dockerfile"
        ports:
          - "{{port}}:{{port}}"
        environment:
          SERVER_PORT: "{{port}}"
          DATABASE_URL: "{{database_url}}"
          SPRING_PROFILES_ACTIVE: "{{profile}}"

  canvas:
    nodeType: spring
    label: Spring Boot
    description: "Java framework"
    category: runtime
    ports:
      - name: http
        port: 8080
        protocol: tcp
    connections:
      inputs:
        - type: database
          name: database
          protocol: any
          env_var: DATABASE_URL
      outputs:
        - type: api
          name: api
          protocol: http
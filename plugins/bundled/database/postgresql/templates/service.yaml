# PostgreSQL service template for stack.yaml
image: postgres:{{version}}
ports:
  - "{{port}}:5432"
environment:
  POSTGRES_PASSWORD: "{{password}}"
  POSTGRES_DB: "{{database}}"
  POSTGRES_USER: "{{user}}"
volumes:
  - host: ./.arfni/data/postgres
    mount: /var/lib/postgresql/data
health:
  tcp:
    port: 5432
restart: unless-stopped